<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para mi Mari 🌻 | Feliz 21 de Septiembre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <body class="esperando">
    
   
    <div id="pantalla-bienvenida">
        <button id="btn-abrir">Toca para abrir tu sorpresa 🌻</button>
    </div>

    <div id="lluvia-petalos"></div>

    <div class="escenario">

        <div class="contenedor-texto-arriba">
            <p id="texto-escribiendo"></p>
        </div>
        
        <div class="cuadro-central">
            <h2>Feliz 21 de Septiembre<3 </h2>
        </div>

        <div class="ramo-amarrado">
            
            
            <div class="base-tallos">
                <div class="tallo-base"></div><div class="tallo-base"></div><div class="tallo-base"></div>
                <div class="tallo-base"></div><div class="tallo-base"></div><div class="tallo-base"></div>
                <div class="tallo-base"></div>
            </div>
            
            
            <div class="cuerda">
                <div class="lazo"></div>
            </div>

            
            <div class="follaje">
                <div class="hoja-grande hg1"></div><div class="hoja-grande hg2"></div>
                <div class="hoja-grande hg3"></div><div class="hoja-grande hg4"></div>
                <div class="hoja-grande hg5"></div><div class="hoja-grande hg6"></div>
            </div>

            
            <div class="girasoles">
                <div class="flor f-arriba" data-mensaje="Feliz 21 de Septiembre, mi bebé hermosa. 💖">
                    <div class="centro"></div><div class="petalos-container"></div>
                </div>
                
                <div class="flor f-mid-izq" data-mensaje="Me encanta todo de ti y siempre sera así. 💛">
                    <div class="centro"></div><div class="petalos-container"></div>
                </div>
                
                <div class="flor f-mid-cen" data-mensaje="Me alegra haberte conocido y ser parte de tu vida asi como tu eres de la mia. ✨">
                    <div class="centro"></div><div class="petalos-container"></div>
                </div>
                
                <div class="flor f-mid-der" data-mensaje="Contigo lo tengo todo mi amor. 🥰">
                    <div class="centro"></div><div class="petalos-container"></div>
                </div>
                
                <div class="flor f-aba-izq" data-mensaje="Pienso en ti en todo momento mi bebé hermosa. 😍">
                    <div class="centro"></div><div class="petalos-container"></div>
                </div>
                
                <div class="flor f-aba-cen" data-mensaje="Eres la mujer que quiero a mi lado para toda mi vida mi futura esposita. 🌻">
                    <div class="centro"></div><div class="petalos-container"></div>
                </div>
                
                <div class="flor f-aba-der" data-mensaje="Gracias por hacer mis días más bonitos. ☀️">
                    <div class="centro"></div><div class="petalos-container"></div>
                </div>
            </div>
        </div>
    </div>

   
    <div id="modal-mensaje" class="oculto">
        <div class="modal-cristal">
            <p id="texto-mensaje"></p>
           
        </div>
    </div>

    




    <audio id="musica-fondo" loop>
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</body>
</html>
